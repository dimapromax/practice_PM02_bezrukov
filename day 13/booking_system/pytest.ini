[pytest]
# Пути для поиска тестов
testpaths = tests

# Python пути для импорта модулей
pythonpath = src

# Маркеры для категоризации тестов
markers =
    unit: Тесты отдельных модулей/классов
    integration: Интеграционные тесты
    slow: Медленные тесты (> 1 секунды)
    fast: Быстрые тесты (< 1 секунды)
    booking: Тесты бронирований
    waitlist: Тесты очереди ожидания
    pricing: Тесты ценообразования

# Настройки покрытия
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=3
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Исключаемые файлы
norecursedirs =
    .git
    .tox
    .venv
    venv
    __pycache__
    *.egg-info

# Минимальная версия pytest
minversion = 7.0

# Настройки логирования
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S